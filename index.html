<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hard Bop 24</title>
  <link rel="stylesheet" href="player.css">
</head>
<body>
  <main class="player">
    <img id="art" class="art" src="" alt="Album artwork">

    <h1 id="title" class="title">Loading&hellip;</h1>
    <p id="artist" class="artist"></p>
    <p id="album" class="album hidden"></p>

    <button id="toggle" class="toggle" type="button">Play</button>
    <p id="status" class="status hidden" role="status" aria-live="polite"></p>

    <audio id="audio" preload="none"></audio>
  </main>

  <script src="player.js"></script>
</body>
</html>
