<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Hard Bop 24 — a 24/7 internet radio station streaming hard bop and post-bop jazz."
    />
    <title>Hard Bop 24</title>
    <!-- Warms DNS/TLS to the station while the HTML parses: the metadata poll and
         the sleeve fetch both go there, and the sleeve URL is not known until the
         metadata returns. No `crossorigin`: the art <img> tags are plain, uncredentialed
         loads, and they carry far more bytes than the metadata fetch, so the connection
         pool this opens should match them, not the fetch() call. -->
    <link rel="preconnect" href="https://radio.lysn.bar" />
    <link rel="stylesheet" href="player.css" />

    <link rel="icon" href="icons/hardbop24.svg" type="image/svg+xml" />
    <link rel="icon" href="icons/hardbop24.ico" sizes="32x32" />
    <!-- iOS ignores manifest icons for the home screen, so this is not redundant. -->
    <link rel="apple-touch-icon" href="icons/hardbop24-180.png" />
    <link rel="manifest" href="manifest.webmanifest" />

    <meta name="theme-color" content="#ab3811" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Hard Bop 24" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  </head>
  <body>
    <main class="player">
      <h1 class="spine">Hard Bop 24</h1>

      <div class="jacket">
        <header class="masthead">
          <p class="badge" id="onair">On air</p>
          <p class="spec" id="spec"></p>
        </header>

        <img
          id="art"
          class="art"
          src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"
          alt=""
          fetchpriority="high"
        />

        <div class="meta" id="meta">
          <h2 id="title" class="title">Tuning in</h2>
          <div class="rule"></div>
          <p id="artist" class="artist"></p>
          <p id="album" class="album hidden"></p>
          <p id="year" class="year hidden"></p>
        </div>

        <button id="toggle" class="toggle" type="button">Play</button>
        <p
          id="status"
          class="status hidden"
          role="status"
          aria-live="polite"
        ></p>

        <section class="history" id="history" aria-labelledby="history-heading">
          <h3 id="history-heading" class="history-heading">Previously</h3>
          <ol id="history-list" class="history-list"></ol>
        </section>
      </div>

      <audio id="audio" preload="none"></audio>
    </main>

    <script src="player.js"></script>
  </body>
</html>
